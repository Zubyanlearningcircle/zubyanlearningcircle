<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Zubyan Learning Circle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <main class="content">
    <header>
      <h1>Zubyan Learning Circle</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#courses">Courses</a>
        <a href="index.html#contact">Contact</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </header>

    <section class="auth-page">
      <div class="auth-card">
        <div class="eyebrow">Join Us</div>
        <h1>Create Your Account</h1>
        <p>Start learning with trusted resources, study guidance, and exam support designed for students.</p>

        <form class="auth-form" action="#" method="post">
          <div class="field-row">
            <div>
              <label for="first-name">First Name</label>
              <input id="first-name" type="text" name="first-name" placeholder="Enter your first name">
            </div>
            <div>
              <label for="last-name">Last Name</label>
              <input id="last-name" type="text" name="last-name" placeholder="Enter your last name">
            </div>
          </div>

          <div>
            <label for="email">Email Address</label>
            <input id="email" type="email" name="email" placeholder="name@example.com">
          </div>

          <div>
            <label for="course">Interested Course</label>
            <select id="course" name="course">
              <option value="">Select a course</option>
              <option>AMU Entrance</option>
              <option>JMI Entrance</option>
              <option>Arabic Language</option>
              <option>School Classes</option>
              <option>NIOS Guidance</option>
            </select>
          </div>

          <div>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Create a strong password">
          </div>

          <button class="submit-button" type="submit">Sign Up</button>
        </form>

        <p class="login-link">Already have an account? <a href="index.html">Return home</a></p>
      </div>
    </section>

    <footer>© 2026 Zubyan Learning Circle</footer>
  </main>
</div>

</body>
</html>
